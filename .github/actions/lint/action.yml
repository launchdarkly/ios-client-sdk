name: Lint
description: 'Run podspec, swiftlint, and generated code checks.'

runs:
  using: composite
  steps:
    - name: Install swiftlint
      shell: bash
      run: brew install swiftlint

    - name: Install sourcery
      shell: bash
      run: brew install sourcery

    - name: Install cocoapods
      shell: bash
      run: gem install cocoapods

    - name: Lint the podspec
      shell: bash
      # Only validate iOS since the other platforms are covered by dedicated build jobs
      run: pod lib lint LaunchDarkly.podspec --allow-warnings --platforms=ios

    - name: Run swiftlint
      shell: bash
      run: |
        cd ./ContractTests
        swiftlint lint

    - name: Check generated code is up to date
      shell: bash
      run: |
        sourcery
        git diff --exit-code LaunchDarkly/GeneratedCode/ || (echo "::error::Generated code is out of date. Run 'sourcery' locally and commit the result." && exit 1)
